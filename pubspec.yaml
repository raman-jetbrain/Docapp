name: docapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  http: ^1.5.0
  file_picker: ^10.3.1
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  pdfx: ^2.9.2
  open_filex: ^4.7.0
  share_plus: ^11.1.0
  google_sign_in: ^7.1.1
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  get: ^4.7.2
  pinput: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  icons_launcher: ^3.0.2

flutter:
  uses-material-design: true

  # The "icons_launcher" section must be a direct child of the "flutter:" key.
  icons_launcher:
    image_path: "assets/images/mic-logo.jpeg" # Use this as the default path
    platforms:
      android:
        enable: true
        # `image_path` is for the main icon, not for platform-specific overrides.
        adaptive_icon_background: "assets/images/Background.jpeg"
        adaptive_icon_foreground: "assets/images/logo.png"
      # Additional platforms like iOS can be added here
      ios:
        enable: true

  assets:
    - assets/images/